name: Devcontainer image

# Builds and publishes the devcontainer image to GHCR when the Dockerfile
# changes, weekly, or on demand (Actions tab). Every push then runs the hello
# world inside the published image.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly rebuild to pick up base-image security patches.
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    name: Detect Dockerfile changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      image: ${{ steps.name.outputs.image }}
      rebuild: ${{ steps.decide.outputs.rebuild }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute lowercase image name
        id: name
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            image:
              - ".devcontainer/Dockerfile"
      - name: Decide whether to rebuild
        id: decide
        run: |
          if [ "${{ steps.filter.outputs.image }}" = "true" ] \
             || [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             || [ "${{ github.event_name }}" = "schedule" ]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          else
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.rebuild == 'true' && github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push per-arch image
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ needs.changes.outputs.image }}:latest-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  merge:
    name: Publish multi-arch manifest
    needs: [changes, build]
    if: needs.changes.outputs.rebuild == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create :latest from the per-arch tags
        run: |
          IMAGE="${{ needs.changes.outputs.image }}"
          docker buildx imagetools create -t "$IMAGE:latest" \
            "$IMAGE:latest-amd64" "$IMAGE:latest-arm64"
          docker buildx imagetools inspect "$IMAGE:latest"

  test:
    name: Hello world inside the image
    needs: [changes, merge]
    # Run after a rebuild, or straight away when only code changed.
    if: always() && needs.changes.result == 'success' && (needs.merge.result == 'success' || needs.merge.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.changes.outputs.image }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # The image defaults to the vscode user; the runner needs root to
      # write its own state files during checkout.
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Build and run
        run: |
          # Root in a non-interactive shell, so load the vscode user's opam
          # switch explicitly instead of via .bashrc.
          eval "$(opam env --root /home/vscode/.opam --switch oxcaml --set-root --set-switch)"
          ocaml -version
          opam list --installed --short ocaml-lsp-server merlin dune
          dune build
          dune exec bin/hello.exe | tee out.txt
          grep -q "Hello from OxCaml" out.txt
